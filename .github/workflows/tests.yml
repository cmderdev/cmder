name: Run Tests

on:
  push:
    branches:
      - master
      - development
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.github/**'
      - '**/.gitignore'
  pull_request:
    branches:
      - master
      - development
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.github/**'
      - '**/.gitignore'

defaults:
  run:
    shell: cmd

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:

  tests:
    runs-on: windows-latest
    continue-on-error: false

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Check trailing whitespace
      shell: pwsh
      run: .\scripts\check-trailing-whitespace.ps1

    - name: Summary - Test execution started
      shell: pwsh
      run: |
        # Get Cmder version
        . scripts/utils.ps1
        $cmderVersion = Get-VersionStr

        $refName = "${{ github.ref_name }}"
        $headRef = "${{ github.head_ref }}"
        $eventName = "${{ github.event_name }}"
        $prNumber = $null
        $actualBranchName = $refName
        $branchLink = "https://github.com/${{ github.repository }}/tree/$refName"
        $prLink = ""
        $workflowLink = "https://github.com/${{ github.repository }}/blob/${{ github.sha }}/.github/workflows/tests.yml"
        $runLink = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        if ($refName -match '^(\d+)/(merge|head)$') {
          $prNumber = $Matches[1]
          # Use head_ref for the actual branch name if available
          if ($headRef) {
            $actualBranchName = $headRef
          }
          $branchLink = "https://github.com/${{ github.repository }}/tree/$actualBranchName"
          $prLink = "https://github.com/${{ github.repository }}/pull/$prNumber"
        } elseif ($eventName -eq "pull_request") {
          # This is a pull request event
          $prNumber = "${{ github.event.pull_request.number }}"
          if ($headRef) {
            $actualBranchName = $headRef
          }
          $branchLink = "https://github.com/${{ github.repository }}/tree/$actualBranchName"
          $prLink = "https://github.com/${{ github.repository }}/pull/$prNumber"
        }

        $summary = @"
        ## ✅ Run Tests - Workflow Summary

        ### Test Environment
        | Property | Value |
        | --- | --- |
        | Repository | [``${{ github.repository }}``](https://github.com/${{ github.repository }}) |
        | Source Branch | [``$actualBranchName``]($branchLink) |
        "@

        if ($prNumber) {
          $summary += "| Pull Request | [#$prNumber]($prLink) |`n"
        }

        $summary += @"
        | Commit | [``${{ github.sha }}``](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |
        | Workflow | [``${{ github.workflow }}``]($workflowLink) |
        | Run | [``${{ github.run_id }}``]($runLink) |
        | Runner OS | ``${{ runner.os }}`` |
        | Cmder Version | **$cmderVersion** |
        | PowerShell Version | **$($PSVersionTable.PSVersion)** |
        | Event | ``$eventName`` |
        "@

        $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

    - name: Install PSScriptAnalyzer
      shell: pwsh
      run: |
        $module = Get-Module -ListAvailable PSScriptAnalyzer | Sort-Object Version -Descending | Select-Object -First 1
        if ($module) {
          Write-Host "Using PSScriptAnalyzer $($module.Version)."
          return
        }

        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
        Install-Module PSScriptAnalyzer -Scope CurrentUser -Repository PSGallery -Force -AllowClobber -AcceptLicense

    - name: Summary - PowerShell analyzer
      shell: pwsh
      run: |
        . scripts/utils.ps1
        Import-Module PSScriptAnalyzer -ErrorAction Stop

        $rootPath = (Resolve-Path -Path .).Path
        $diagnostics = @(Invoke-ScriptAnalyzer -Path $rootPath -Recurse -Severity Error, Warning, Information)
        $severityOrder = @{
          Error = 0
          Warning = 1
          Information = 2
        }

        $diagnostics = @(
          $diagnostics | Sort-Object `
            @{ Expression = { $severityOrder[$_.Severity.ToString()] } }, `
            @{ Expression = { $_.ScriptName } }, `
            @{ Expression = { $_.Line } }, `
            @{ Expression = { $_.Column } }, `
            @{ Expression = { $_.RuleName } }
        )

        $summary = [System.Collections.Generic.List[string]]::new()
        $summary.Add("### PowerShell ScriptAnalyzer")
        $summary.Add("")

        if ($diagnostics.Count -eq 0) {
          $summary.Add("No PowerShell issues were reported by PSScriptAnalyzer.")
          $summary.Add("")
        } else {
          $fileCount = @($diagnostics | Where-Object { $_.ScriptName } | Select-Object -ExpandProperty ScriptName -Unique).Count
          $ruleCount = @($diagnostics | Select-Object -ExpandProperty RuleName -Unique).Count
          $summary.Add("PSScriptAnalyzer reported **$($diagnostics.Count)** advisory findings across **$ruleCount** rule types and **$fileCount** PowerShell files.")
          $summary.Add("")
          $summary.Add("| Severity | Count |")
          $summary.Add("| --- | ---: |")

          foreach ($severity in @("Error", "Warning", "Information")) {
            $count = @($diagnostics | Where-Object { $_.Severity.ToString() -eq $severity }).Count
            $summary.Add("| $severity | $count |")
          }

          $summary.Add("")
          $summary.Add("> These findings are grouped by rule type, then file. Rule groups are sorted by highest severity, finding count, and rule name. Findings are advisory; they do not fail the test job.")
          $summary.Add("")

          $ruleGroups = @(
            $diagnostics |
              Group-Object RuleName |
              ForEach-Object {
                $groupDiagnostics = @($_.Group)
                $highestSeverityRank = ($groupDiagnostics | ForEach-Object { $severityOrder[$_.Severity.ToString()] } | Measure-Object -Minimum).Minimum
                $highestSeverity = ($severityOrder.GetEnumerator() | Where-Object { $_.Value -eq $highestSeverityRank } | Select-Object -First 1).Key
                $groupFiles = @($groupDiagnostics | Where-Object { $_.ScriptName } | Select-Object -ExpandProperty ScriptName -Unique)

                [pscustomobject]@{
                  RuleName = $_.Name
                  Severity = $highestSeverity
                  SeverityRank = $highestSeverityRank
                  Count = $groupDiagnostics.Count
                  FileCount = $groupFiles.Count
                  Diagnostics = $groupDiagnostics
                }
              } |
              Sort-Object `
                @{ Expression = { $_.SeverityRank } }, `
                @{ Expression = { -1 * $_.Count } }, `
                @{ Expression = { $_.RuleName } }
          )

          $summary.Add("| Rule | Severity | Findings | Files |")
          $summary.Add("| --- | --- | ---: | ---: |")
          foreach ($ruleGroup in $ruleGroups) {
            $summary.Add("| ``$($ruleGroup.RuleName)`` | $($ruleGroup.Severity) | $($ruleGroup.Count) | $($ruleGroup.FileCount) |")
          }
          $summary.Add("")

          foreach ($ruleGroup in $ruleGroups) {
            $summary.Add("<details>")
            $summary.Add("<summary>$($ruleGroup.Severity): $($ruleGroup.RuleName) ($($ruleGroup.Count) findings across $($ruleGroup.FileCount) files)</summary>")
            $summary.Add("")

            $fileGroups = @(
              $ruleGroup.Diagnostics |
                Group-Object {
                  Get-RelativeScriptPath -ScriptPath $_.ScriptPath -RootPath $rootPath -FallbackName $_.ScriptName
                } |
                Sort-Object Name
            )

            foreach ($fileGroup in $fileGroups) {
              $relativePath = $fileGroup.Name
              $summary.Add("#### ``$relativePath`` ($($fileGroup.Count))")
              $summary.Add("")

              foreach ($diagnostic in @($fileGroup.Group | Sort-Object Line, Column, Message)) {
                $line = if ($null -ne $diagnostic.Line) { [int]$diagnostic.Line } else { 0 }
                $column = if ($null -ne $diagnostic.Column) { [int]$diagnostic.Column } else { 0 }
                $location = Get-MarkdownLocation -RelativePath $relativePath -Line $line
                $message = ConvertTo-HtmlText -Text (ConvertTo-OneLine -Text $diagnostic.Message)

                $summary.Add("- **$location**")
                $summary.Add("  - Message: $message")
                if ($line -gt 0 -or $column -gt 0) {
                  $summary.Add("  - Position: line $line, column $column")
                }
                $summary.Add("")
              }
            }

            $summary.Add("</details>")
            $summary.Add("")
          }

          Write-Warning "PSScriptAnalyzer reported $($diagnostics.Count) advisory findings."
        }

        $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

    - name: Initialize vendors
      shell: pwsh
      working-directory: scripts
      run: .\build.ps1 -verbose

    - name: Summary - Vendor initialization
      if: success()
      shell: pwsh
      run: |
        # Get vendor versions from sources.json
        $vendorInfo = @()
        $sources = Get-Content "vendor\sources.json" -Raw | ConvertFrom-Json
        foreach ($source in $sources) {
          $dir = $source.name
          if (-not $dir) {
            continue
          }
          $versionFile = "vendor/$dir/.cmderver"
          if (Test-Path $versionFile) {
            $version = Get-Content $versionFile -Raw
            $vendorInfo += "- **$dir**: $($version.Trim())"
          }
        }

        $summary = @"
        ### ⚙️ Vendor Initialization

        ✅ Vendor dependencies initialized successfully.

        **Vendor Versions:**
        "@

        $(
          if ($vendorInfo.Count -eq 0) {
            $summary += "_No vendor version information available._"
          } else {
            $summary += $vendorInfo -join "`n"
          }
        )

        $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8

    - name: Testing Clink Shell
      id: test-clink
      shell: pwsh
      run: |
          $startTime = Get-Date
          cmd /c vendor\init.bat /v /d /t
          $duration = [math]::Round(((Get-Date) - $startTime).TotalSeconds, 2)
          echo "duration=$duration" >> $env:GITHUB_OUTPUT

    - name: Testing PowerShell
      id: test-powershell
      shell: pwsh
      run: |
          $startTime = Get-Date
          PowerShell.exe -ExecutionPolicy Bypass -NoLogo -NoProfile -Command "$env:CMDER_DEBUG='1'; . 'vendor\profile.ps1'"
          $duration = [math]::Round(((Get-Date) - $startTime).TotalSeconds, 2)
          echo "duration=$duration" >> $env:GITHUB_OUTPUT

    - name: Testing Bash
      id: test-bash
      shell: pwsh
      run: |
          $startTime = Get-Date
          bash vendor/cmder.sh
          $duration = [math]::Round(((Get-Date) - $startTime).TotalSeconds, 2)
          echo "duration=$duration" >> $env:GITHUB_OUTPUT

    - name: Summary - All tests completed
      if: success()
      shell: pwsh
      run: |
        function Format-Duration {
          param(
            [AllowEmptyString()]
            [string]$Duration
          )

          if ($Duration) {
            return "$Duration s"
          }

          return "N/A"
        }

        $clinkDuration = Format-Duration "${{ steps.test-clink.outputs.duration }}"
        $powershellDuration = Format-Duration "${{ steps.test-powershell.outputs.duration }}"
        $bashDuration = Format-Duration "${{ steps.test-bash.outputs.duration }}"

        $summary = @"

        ### 📋 Test Results

        | Test | Status | Duration |
        | --- | --- | --- |
        | Clink Shell | ✅ Passed | $clinkDuration |
        | PowerShell | ✅ Passed | $powershellDuration |
        | Bash | ✅ Passed | $bashDuration |

        ### ✅ All Tests Completed

        All shell environments tested successfully!

        **Test Coverage:**
        - ✅ Clink shell environment (Windows cmd.exe with Clink)
        - ✅ PowerShell environment (with Cmder profile)
        - ✅ Bash environment (Git Bash integration)
        "@

        $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
